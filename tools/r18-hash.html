<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>R-18 명단 해시 생성기</title>
<style>
  :root { --bg: #ffffff; --fg: #1d1d1f; --muted: #6e6e73; --line: #d2d2d7; --accent: #0a66c2; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #161618; --fg: #f5f5f7; --muted: #a1a1a6; --line: #3a3a3c; --accent: #4ea1ff; }
  }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.6 system-ui, sans-serif; }
  main { max-width: 640px; margin: 0 auto; padding: 32px 16px; }
  h1 { font-size: 22px; font-weight: 600; margin: 0 0 8px; }
  p { color: var(--muted); margin: 0 0 24px; }
  label { display: block; font-size: 14px; margin: 16px 0 6px; }
  input, output { box-sizing: border-box; width: 100%; padding: 10px 12px; border: 1px solid var(--line);
    border-radius: 8px; background: transparent; color: var(--fg); font: inherit; }
  output { display: block; min-height: 46px; font-family: ui-monospace, monospace; font-size: 13px; word-break: break-all; }
  button { margin-top: 12px; padding: 8px 16px; border: 0; border-radius: 8px; background: var(--accent);
    color: #fff; font: inherit; cursor: pointer; }
  button:disabled { opacity: .4; cursor: default; }
  small { color: var(--muted); }
</style>
</head>
<body>
<main>
  <h1>R-18 명단 해시 생성기</h1>
  <p>VRChat 표시 이름을 입력하면 r18-whitelist.txt 에 넣을 한 줄이 만들어져요. 이름은 이 페이지 밖으로 전송되지 않아요.</p>

  <label for="name">VRChat 표시 이름 (대소문자, 띄어쓰기까지 정확히)</label>
  <input id="name" autocomplete="off" spellcheck="false">

  <label for="salt">솔트 (월드의 WhitelistGate 와 같아야 해요)</label>
  <input id="salt" value="furpark-r18-v1:" spellcheck="false">

  <label for="hash">명단에 넣을 줄</label>
  <output id="hash"></output>
  <button id="copy" disabled>복사</button>
  <small id="status"></small>
</main>
<script>
  const nameInput = document.getElementById('name');
  const saltInput = document.getElementById('salt');
  const out = document.getElementById('hash');
  const copy = document.getElementById('copy');
  const status = document.getElementById('status');

  // crypto.subtle only exists on https or localhost; this covers opening the file some other way.
  function sha256Fallback(bytes) {
    const k = [];
    for (let n = 2, found = 0; found < 64; n++) {
      let prime = true;
      for (let d = 2; d * d <= n; d++) if (n % d === 0) { prime = false; break; }
      if (prime) k[found++] = (Math.cbrt(n) % 1) * 2 ** 32 | 0;
    }
    const h = [0x6a09e667, 0xbb67ae85, 0x3c6ef372, 0xa54ff53a, 0x510e527f, 0x9b05688c, 0x1f83d9ab, 0x5be0cd19];
    const len = bytes.length, padded = Math.ceil((len + 9) / 64) * 64;
    const m = new Uint8Array(padded);
    m.set(bytes); m[len] = 0x80;
    new DataView(m.buffer).setUint32(padded - 4, len * 8);
    new DataView(m.buffer).setUint32(padded - 8, Math.floor(len * 8 / 2 ** 32));
    const rotr = (x, n) => (x >>> n) | (x << (32 - n));
    const w = new Array(64);
    for (let c = 0; c < padded; c += 64) {
      for (let i = 0; i < 16; i++) w[i] = new DataView(m.buffer).getUint32(c + i * 4);
      for (let i = 16; i < 64; i++) {
        const s0 = rotr(w[i - 15], 7) ^ rotr(w[i - 15], 18) ^ (w[i - 15] >>> 3);
        const s1 = rotr(w[i - 2], 17) ^ rotr(w[i - 2], 19) ^ (w[i - 2] >>> 10);
        w[i] = (w[i - 16] + s0 + w[i - 7] + s1) | 0;
      }
      let [a, b, cc, d, e, f, g, hh] = h;
      for (let i = 0; i < 64; i++) {
        const t1 = (hh + (rotr(e, 6) ^ rotr(e, 11) ^ rotr(e, 25)) + ((e & f) ^ (~e & g)) + k[i] + w[i]) | 0;
        const t2 = ((rotr(a, 2) ^ rotr(a, 13) ^ rotr(a, 22)) + ((a & b) ^ (a & cc) ^ (b & cc))) | 0;
        hh = g; g = f; f = e; e = (d + t1) | 0; d = cc; cc = b; b = a; a = (t1 + t2) | 0;
      }
      [a, b, cc, d, e, f, g, hh].forEach((v, i) => h[i] = (h[i] + v) | 0);
    }
    return h.map(v => (v >>> 0).toString(16).padStart(8, '0')).join('');
  }

  async function sha256Hex(text) {
    const bytes = new TextEncoder().encode(text);
    if (!(window.crypto && crypto.subtle)) return sha256Fallback(bytes);
    const digest = await crypto.subtle.digest('SHA-256', bytes);
    return [...new Uint8Array(digest)].map(b => b.toString(16).padStart(2, '0')).join('');
  }

  async function update() {
    status.textContent = '';
    if (!nameInput.value) { out.textContent = ''; copy.disabled = true; return; }
    out.textContent = await sha256Hex(saltInput.value + nameInput.value);
    copy.disabled = false;
  }

  nameInput.addEventListener('input', update);
  saltInput.addEventListener('input', update);
  copy.addEventListener('click', async () => {
    try {
      await navigator.clipboard.writeText(out.textContent);
      status.textContent = ' 복사했어요';
    } catch {
      status.textContent = ' 복사에 실패했어요. 직접 선택해서 복사해 주세요';
    }
  });
</script>
</body>
</html>
